group 'ai.nextech.nexvpn_flutter'
version '1.0.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/artifact/ai.nextech/nexvpn' }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'ai.nextech.nexvpn_flutter'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'ai.nextech:nexvpn:1.0.0'
}
